name: R-CMD-check-bioc

on:
  push:
    branches: [devel]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    # Check against Bioconductor devel, which is what the Bioc builders use.
    # Matching the builders is the whole point: a stale local library is how
    # the defunct lattice::parallel import went unnoticed until it broke
    # installation outright (#28).
    container: bioconductor/bioconductor_docker:devel

    env:
      # Suggests are installed below, so this is not covering for a missing
      # dependency list -- it stops a transient failure to install one of the
      # large annotation packages from failing the whole check.
      _R_CHECK_FORCE_SUGGESTS_: false

    steps:
      - uses: actions/checkout@v4

      # quarto-actions/setup shells out to jq to resolve the release download
      # URL, and the Bioconductor container does not ship jq -- without this the
      # setup step dies with "jq: command not found". Running as root in the
      # container, so no sudo.
      - name: Install jq
        run: apt-get update -qq && apt-get install -y --no-install-recommends jq

      # Posit's supported action for provisioning Quarto. The vignettes are
      # .qmd with %\VignetteEngine{quarto::html} (#31), so R CMD build needs
      # the Quarto CLI. Installing it explicitly rather than hoping the
      # Bioconductor container ships it makes CI deterministic and pins the
      # version we test against.
      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Cache R library
        uses: actions/cache@v4
        with:
          path: /usr/local/lib/R/site-library
          key: ${{ runner.os }}-bioc-devel-${{ hashFiles('DESCRIPTION') }}
          restore-keys: ${{ runner.os }}-bioc-devel-

      - name: Install dependencies
        shell: Rscript {0}
        run: |
          options(warn = 1, Ncpus = 2)
          BiocManager::install(ask = FALSE, update = TRUE)
          if (!requireNamespace("remotes", quietly = TRUE)) install.packages("remotes")
          # Suggests included: the vignettes execute against TCGAMethylation450k,
          # Homo.sapiens, the TxDb and lumi, so building them needs the full set.
          remotes::install_deps(
            dependencies = TRUE,
            repos = BiocManager::repositories()
          )
          remotes::install_cran(c("rcmdcheck", "testthat", "quarto"))

      - name: Check
        shell: Rscript {0}
        run: |
          # Vignettes ARE built here. They are the package's front door, they
          # exercise a lot of real code paths, and a Quarto toolchain problem
          # should surface on a PR rather than on the Bioconductor build report.
          #
          # error_on = "error", not "warning": the package still carries a
          # backlog of legacy check NOTEs. Failing on those would mean CI is red
          # by default, which teaches everyone to ignore it.
          res <- rcmdcheck::rcmdcheck(
            args = "--no-manual",
            error_on = "error",
            check_dir = "check"
          )

      - name: Upload check results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: check-results
          path: check
